#
# === base conf settings ===
set -g mouse on

set -g mode-keys vi

#index number
set -g base-index 1
set -g pane-base-index 1

#bind keys 
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"


# === look & feel ===
#true colors
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"
# style
mediumpurple="#bd93f9"
lightblack="#282a36"
violet="#d6acff"
tomato="#ff6347"
# status bar
set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${mediumpurple},bg=default"
set -g status-left "#[fg=${violet},bold] #S #[fg=${mediumpurple},nobold] | "
set -g window-status-current-format "#[fg=${tomato},bold] #[underscore]#I:#W"
set -g window-status-format " #I:#W"
set -g mode-style "fg=${lightblack},bg=${violet}"
# pane separators
set -g pane-border-lines simple
#
#._ |    _ o._  _
#|_)||_|(_||| |_>
#|       _|
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Customize where resurrect save files are stored.
set -g @resurrect-dir "~/.config/tmux/resurrect"
# for vim session 
  set -g @resurrect-strategy-vim 'session'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
